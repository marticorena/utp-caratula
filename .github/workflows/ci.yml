name: Check app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cover_test
          POSTGRES_USER: cover_test
          POSTGRES_PASSWORD: cover_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cover_test -d cover_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FONT_MODE: portable
      TEST_DATABASE_URL: postgresql://cover_test:cover_test_only@localhost:5432/cover_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config fonts-crosextra-carlito fonts-liberation2 fonts-dejavu-core
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t utp-cover-check .
